<div class="registrar-container">

  <div class="registrar-content">

    <div class="registrar-header">

      <h1>Registrar Nueva Comisión</h1>

      <button
        type="button"
        class="btn-volver"
        (click)="cancelar()">
        ← Volver
      </button>

    </div>

    <form
      (ngSubmit)="guardarComision()"
      class="registrar-form">

      <div class="form-row">

        <div class="campo">

          <label for="nombreComision">
            Nombre de la comisión
          </label>

          <input
            id="nombreComision"
            type="text"
            name="nombre"
            [(ngModel)]="comision.nombre"
            placeholder="Ej: Prog1-C1-TM"
            required>

        </div>

        <div class="campo">

          <label for="cantidadAlumnos">
            Cantidad de alumnos
          </label>

          <input
            id="cantidadAlumnos"
            type="number"
            name="cantidad_alumnos"
            [(ngModel)]="comision.cantidad_alumnos"
            min="1"
            required>

        </div>

      </div>

      <div class="campo">

        <label for="asignatura">
          Asignatura
        </label>

        <select
          id="asignatura"
          name="asignatura"
          [(ngModel)]="comision.asignatura_id"
          aria-label="Asignatura"
          required>

          <option [ngValue]="null">
            Seleccionar asignatura
          </option>

          <option
            *ngFor="let asignatura of asignaturas"
            [ngValue]="+asignatura.id">

            {{ asignatura.nombre_asignatura }}

          </option>

        </select>

      </div>

      <div class="campo">

        <label for="carrera">
          Carrera
        </label>

        <select
          id="carrera"
          name="carrera"
          [(ngModel)]="comision.carrera_id"
          aria-label="Carrera"
          required>

          <option [ngValue]="null">
            Seleccionar carrera
          </option>

          <option
            *ngFor="let carrera of carreras"
            [ngValue]="+carrera.id">

            {{ carrera.nombre }}

          </option>

        </select>

      </div>

      <div class="campo">

        <label for="profesor">
          Profesor
        </label>

        <select
          id="profesor"
          name="profesor"
          [(ngModel)]="comision.usuario_profesor_id"
          aria-label="Profesor"
          required>

          <option [ngValue]="null">
            Seleccionar profesor
          </option>

          <option
            *ngFor="let profesor of profesores"
            [ngValue]="+profesor.id">

            {{ profesor.apellido }}, {{ profesor.nombre }}

          </option>

        </select>

      </div>

      <div
        *ngIf="mensajeError"
        class="mensaje-resultado error">

        {{ mensajeError }}

      </div>

      <div class="form-actions">

        <button
          type="button"
          class="btn-cancelar"
          (click)="cancelar()">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-registrar"
          [disabled]="guardando">

          {{ guardando ? 'Guardando...' : 'Registrar Comisión' }}

        </button>

      </div>

    </form>

  </div>

</div>


<!-- MODAL DE ÉXITO -->

<div
  *ngIf="mostrarExito"
  class="modal-overlay">

  <div class="modal-exito">

    <div class="icono-exito">
      ✓
    </div>

    <h2>¡Comisión registrada!</h2>

    <p>
      La comisión fue registrada correctamente.
    </p>

    <button
      type="button"
      class="btn-aceptar"
      (click)="cerrarExito()">
      Aceptar
    </button>

  </div>

</div>
