<div class="registrar-container">

  <div class="registrar-content">

    <div class="registrar-header">

      <h1>
        Registrar Nueva Comisión
      </h1>

      <button
        type="button"
        class="btn-volver"
        (click)="cancelar()">
        ← Volver
      </button>

    </div>


    <form
      (ngSubmit)="guardarComision()"
      class="registrar-form">


      <div class="form-row">

        <div class="campo">

          <label for="codigoComision">
            Código de la comisión (6 caracteres)
          </label>

          <input
            id="codigoComision"
            type="text"
            name="codigo"
            [(ngModel)]="comision.codigo"
            maxlength="6"
            required>

        </div>

        <div class="campo">

          <label for="nombreComision">
            Nombre de la comisión
          </label>

          <input
            id="nombreComision"
            type="text"
            name="nombre"
            [(ngModel)]="comision.nombre"
            maxlength="50"
            placeholder="Ej: Prog1-C1-TM"
            required>

        </div>


        <div class="campo">

          <label for="cantidadAlumnos">
            Cantidad de alumnos
          </label>

          <input
            id="cantidadAlumnos"
            type="number"
            name="cantidad_alumnos"
            [(ngModel)]="comision.cantidad_alumnos"
            min="1"
            max="100"
            required>

        </div>

      </div>


      <div class="campo">

        <label for="asignatura">
          Asignatura
        </label>

        <select
          id="asignatura"
          name="asignatura"
          [(ngModel)]="comision.asignatura_id"
          aria-label="Asignatura"
          required>

          <option [ngValue]="null">
            Seleccionar asignatura
          </option>

          <option
            *ngFor="let asignatura of asignaturas"
            [ngValue]="+asignatura.id">

            {{ asignatura.nombre }}

          </option>

        </select>

        <div
          *ngIf="errorCargaMaterias"
          class="mensaje-resultado error">
          {{ errorCargaMaterias }}
        </div>

      </div>


      <div class="campo">

        <label for="carrera">
          Carrera
        </label>

        <select
          id="carrera"
          name="carrera"
          [(ngModel)]="comision.carrera_id"
          aria-label="Carrera"
          required>

          <option [ngValue]="null">
            Seleccionar carrera
          </option>

          <option
            *ngFor="let carrera of carreras"
            [ngValue]="+carrera.id">

            {{ carrera.nombre }}

          </option>

        </select>

        <div
          *ngIf="errorCargaCarreras"
          class="mensaje-resultado error">
          {{ errorCargaCarreras }}
        </div>

      </div>


      <div class="campo">

        <label for="profesor">
          Profesor
        </label>

        <select
          id="profesor"
          name="profesor"
          [(ngModel)]="comision.usuario_profesor_id"
          aria-label="Profesor"
          required>

          <option [ngValue]="null">
            Seleccionar profesor
          </option>

          <option
            *ngFor="let profesor of profesores"
            [ngValue]="+profesor.id">

            {{ profesor.apellido }},
            {{ profesor.nombre }}

          </option>

        </select>

      </div>


      <div
        *ngIf="mensajeError"
        class="mensaje-resultado error">

        {{ mensajeError }}

      </div>


      <div
        *ngIf="mensajeExito"
        class="mensaje-resultado exito">

        {{ mensajeExito }}

      </div>


      <div class="form-actions">

        <button
          type="button"
          class="btn-cancelar"
          (click)="cancelar()">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-registrar"
          [disabled]="guardando">

          {{
            guardando
              ? 'Guardando...'
              : 'Registrar Comisión'
          }}

        </button>

      </div>

    </form>

  </div>

</div>
