<main class="login-page">
    <img class="login-background" src="/fondo.png" alt="" aria-hidden="true" />
    <section class="login-form">
        <header class="login-header">
            <span class="eyebrow">Mi Aula</span>
            <h1>Inicio de sesión</h1>
            <p class="login-subtitle">Ingresá para gestionar tus aulas y reservas.</p>
        </header>
        <form [formGroup]="form" (ngSubmit)="Enviar()">
            <div class="campo">
                <label for="email">Email</label>
                <input id="email" type="text" formControlName="email">
            </div>
            <div class="campo">
                <label for="contraseña">Contraseña</label>
                <input id="contraseña" type="password" formControlName="password">
            </div>
            <button class="btn-enviar" type="submit" [disabled]="form.invalid">Ingresar</button>
            <span class="error-general">{{ mensajeError() }}</span>
        </form>
    </section>
</main>
