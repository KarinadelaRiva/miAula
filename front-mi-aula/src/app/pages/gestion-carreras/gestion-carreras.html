<div class="gestion-container">
  <div class="gestion-card">
    <div class="gestion-header">
      <h1>Gestión de Carreras</h1>
      <button routerLink="/dashboard" class="btn-volver">← Volver</button>
    </div>

    <div class="seccion">
      <h2>Registrar Carrera</h2>
      <form class="form-grid" [formGroup]="form" (ngSubmit)="registrarCarrera()">
        <label>
          Nombre de la carrera
          <input type="text" formControlName="nombre" />
        </label>
        <button type="submit" class="btn-opcion">Guardar carrera</button>
      </form>
    </div>

    <div class="seccion">
      <h2>Administrar Carreras</h2>
      @if (error) {
        <p class="error">{{ error }}</p>
      }
      @if (cargando) {
        <p>Cargando carreras...</p>
      } @else {
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            @for (carrera of carreras; track carrera.id) {
              <tr>
                <td>{{ carrera.nombre }}</td>
                <td>
                  <button type="button" class="btn-danger" (click)="eliminarCarrera(carrera.id)">Eliminar</button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      }
    </div>
  </div>
</div>
