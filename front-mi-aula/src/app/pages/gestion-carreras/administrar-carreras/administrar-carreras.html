<div class="administrar-container">

  <div class="administrar-card">

    <div class="header">

      <div>
        <h1>Gestión de Carreras</h1>
        <p>Consultar, editar, eliminar o registrar carreras.</p>
      </div>

      <div class="header-actions">

        <button
          type="button"
          routerLink="/gestion-carreras/registrar-carrera"
          class="btn-nuevo">
          + Nueva Carrera
        </button>

        <button
          type="button"
          routerLink="/dashboard"
          class="btn-volver">
          ← Volver
        </button>

      </div>

    </div>

    <!-- BUSCADOR -->

    <div class="buscador">

      <input
        type="text"
        placeholder="Buscar carrera..."
        [(ngModel)]="busqueda"
        (click)="mostrarTodas()"
        (input)="buscar()"
        aria-label="Buscar carrera">

    </div>

    <!-- MENSAJE -->

    <div *ngIf="mensaje" class="mensaje">
      {{ mensaje }}
    </div>

    <!-- TABLA -->

    <div class="tabla-container">

      <table>

        <thead>
          <tr>
            <th>ID</th>
            <th>Carrera</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let carrera of carrerasFiltradas">

            <td>
              {{ carrera.id }}
            </td>

            <td>

              <input
                *ngIf="carreraEditando?.id === carrera.id"
                class="input-edicion"
                [(ngModel)]="nombreEditado"
                aria-label="Editar nombre de carrera">

              <span *ngIf="carreraEditando?.id !== carrera.id">
                {{ carrera.nombre }}
              </span>

            </td>

            <td class="acciones">

              <ng-container *ngIf="carreraEditando?.id === carrera.id">

                <button
                  type="button"
                  class="btn-guardar"
                  (click)="guardarEdicion()">
                  Guardar
                </button>

                <button
                  type="button"
                  class="btn-cancelar"
                  (click)="cancelarEdicion()">
                  Cancelar
                </button>

              </ng-container>

              <ng-container *ngIf="carreraEditando?.id !== carrera.id">

                <button
                  type="button"
                  class="btn-editar"
                  (click)="editarCarrera(carrera)">
                  Editar
                </button>

                <button
                  type="button"
                  class="btn-eliminar"
                  (click)="eliminarCarrera(carrera)">
                  Eliminar
                </button>

              </ng-container>

            </td>

          </tr>

        </tbody>

      </table>

      <div
        *ngIf="carrerasFiltradas.length === 0"
        class="sin-resultados">

        No se encontraron carreras.

      </div>

    </div>

  </div>

</div>
