<div class="administrar-container">

  <div class="administrar-card">

    <div class="administrar-header">

      <div>

        <span class="eyebrow">
          Panel administrativo
        </span>

        <h1>
          Gestión de Carreras
        </h1>

        <p>
          Consultá, modificá y administrá las carreras del sistema.
        </p>

      </div>


      <div class="header-actions">

        <button
          type="button"
          routerLink="/gestion-carreras/registrar-carrera"
          class="btn-nuevo">
          + Nueva carrera
        </button>

        <button
          type="button"
          routerLink="/dashboard"
          class="btn-volver">
          ← Volver
        </button>

      </div>

    </div>


    <div class="filtros-section">

      <input
        type="text"
        class="input-buscar"
        placeholder="Buscar carrera..."
        [(ngModel)]="busqueda"
        (input)="buscar()"
        aria-label="Buscar carrera">

    </div>


    <div
      *ngIf="mensaje"
      class="mensaje">

      {{ mensaje }}

    </div>


    <div class="tabla-container">

      <table>

        <thead>

          <tr>

            <th>ID</th>

            <th>Carrera</th>

            <th>Acciones</th>

          </tr>

        </thead>


        <tbody>

          <tr
            *ngFor="let carrera of carrerasFiltradas">


            <td data-label="ID">

              {{ carrera.id }}

            </td>


            <td data-label="Carrera">

              <input
                *ngIf="carreraEditando?.id === carrera.id"
                class="input-edicion"
                [(ngModel)]="nombreEditado"
                aria-label="Editar nombre de carrera">


              <strong
                *ngIf="carreraEditando?.id !== carrera.id">

                {{ carrera.nombre }}

              </strong>

            </td>


            <td
              data-label="Acciones"
              class="acciones">


              <ng-container
                *ngIf="carreraEditando?.id === carrera.id">

                <button
                  type="button"
                  class="btn-guardar"
                  (click)="guardarEdicion()">
                  Guardar
                </button>


                <button
                  type="button"
                  class="btn-cancelar"
                  (click)="cancelarEdicion()">
                  Cancelar
                </button>

              </ng-container>


              <ng-container
                *ngIf="carreraEditando?.id !== carrera.id">

                <button
                  type="button"
                  class="btn-editar"
                  (click)="editarCarrera(carrera)">
                  Editar
                </button>


                <button
                  type="button"
                  class="btn-eliminar"
                  (click)="abrirConfirmacionEliminar(carrera)">
                  Eliminar
                </button>

              </ng-container>

            </td>

          </tr>

        </tbody>

      </table>


      <div
        *ngIf="carrerasFiltradas.length === 0"
        class="sin-resultados">

        No se encontraron carreras.

      </div>

    </div>

  </div>

</div>


<!-- CONFIRMACIÓN DE ELIMINACIÓN -->

<div
  *ngIf="mostrarConfirmacionEliminar"
  class="modal-overlay">

  <div class="modal-confirmacion">

    <h2>
      Eliminar carrera
    </h2>

    <p>

      ¿Seguro que querés eliminar la carrera

      <strong>
        "{{ carreraAEliminar?.nombre }}"
      </strong>?

    </p>


    <div class="modal-actions">

      <button
        type="button"
        class="btn-cancelar"
        (click)="cancelarEliminar()">
        Cancelar
      </button>


      <button
        type="button"
        class="btn-eliminar"
        (click)="confirmarEliminar()">
        Eliminar
      </button>

    </div>

  </div>

</div>
