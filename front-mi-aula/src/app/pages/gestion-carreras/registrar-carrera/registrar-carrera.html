<div class="registrar-container">

  <div class="registrar-content">

    <div class="registrar-header">

      <h1>Registrar Nueva Carrera</h1>

      <button
        type="button"
        class="btn-volver"
        (click)="cancelar()">
        ← Volver
      </button>

    </div>

    <form
      (ngSubmit)="guardarCarrera()"
      class="registrar-form">

      <div class="campo">

        <label for="codigoCarrera">
          Código de la carrera
        </label>

        <input
          id="codigoCarrera"
          type="text"
          name="codigo"
          [(ngModel)]="codigo"
          pattern="[A-Za-z0-9]{6}"
          placeholder="Ej: TUP001"
          maxlength="6"
          required>

      </div>

      <div class="campo">

        <label for="nombreCarrera">
          Nombre de la carrera
        </label>

        <input
          id="nombreCarrera"
          type="text"
          name="nombre"
          [(ngModel)]="nombre"
          placeholder="Ej: Tecnicatura Universitaria en Programación"
          maxlength="50"
          required>

      </div>

      <div
        *ngIf="mensajeError"
        class="mensaje-resultado error">

        {{ mensajeError }}

      </div>

      <div
        *ngIf="mensajeExito"
        class="mensaje-resultado exito">

        {{ mensajeExito }}

      </div>

      <div class="form-actions">

        <button
          type="button"
          class="btn-cancelar"
          (click)="cancelar()">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-registrar"
          [disabled]="guardando">

          {{
            guardando
              ? 'Guardando...'
              : 'Registrar Carrera'
          }}

        </button>

      </div>

    </form>

  </div>

</div>
