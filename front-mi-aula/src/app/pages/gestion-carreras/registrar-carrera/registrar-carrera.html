<div class="registrar-container">

  <div class="registrar-content">

    <div class="registrar-header">

      <h1>Registrar Nueva Carrera</h1>

      <button
        type="button"
        class="btn-volver"
        (click)="cancelar()">
        ← Volver
      </button>

    </div>

    <form
      (ngSubmit)="guardarCarrera()"
      class="registrar-form">

      <div class="campo">

        <label for="nombreCarrera">
          Nombre de la carrera
        </label>

        <input
          id="nombreCarrera"
          type="text"
          name="nombre"
          [(ngModel)]="nombre"
          placeholder="Ej: Tecnicatura Universitaria en Programación"
          required>

      </div>

      <div
        *ngIf="mensajeError"
        class="mensaje-resultado error">

        {{ mensajeError }}

      </div>

      <div class="form-actions">

        <button
          type="button"
          class="btn-cancelar"
          (click)="cancelar()">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-registrar"
          [disabled]="guardando">

          {{ guardando ? 'Guardando...' : 'Registrar Carrera' }}

        </button>

      </div>

    </form>

  </div>

</div>


<!-- MODAL DE ÉXITO -->

<div
  *ngIf="mostrarExito"
  class="modal-overlay">

  <div class="modal-exito">

    <div class="icono-exito">
      ✓
    </div>

    <h2>¡Carrera registrada!</h2>

    <p>
      La carrera fue registrada correctamente.
    </p>

    <button
      type="button"
      class="btn-aceptar"
      (click)="cerrarExito()">
      Aceptar
    </button>

  </div>

</div>
