<div class="gestion-container">
  <div class="gestion-card">
    <div class="gestion-header">
      <h1>Gestión de Espacios</h1>
      <button routerLink="/carreras" class="btn-volver">← Volver</button>
    </div>

    <div class="opciones-grid">
      <div class="opcion-card">
        <div class="opcion-icon registrar">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <line x1="12" y1="10" x2="12" y2="16"></line>
            <line x1="9" y1="13" x2="15" y2="13"></line>
          </svg>
        </div>
        <h3>Registrar Espacio</h3>
        <p>Crear un nuevo espacio físico para aulas o laboratorios</p>
        <button routerLink="/espacios/registrar" class="btn-opcion">Ir a Registro</button>
      </div>

      <div class="opcion-card">
        <div class="opcion-icon administrar">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <line x1="8" y1="4" x2="8" y2="20"></line>
          </svg>
        </div>
        <h3>Administrar Espacios</h3>
        <p>Consultar espacios, deshabilitarlos, reactivarlos o eliminarlos</p>
        <button routerLink="/espacios/administrar" class="btn-opcion">Ir a Administración</button>
      </div>
    </div>
  </div>
</div>
