<div class="gestion-container">
  <div class="gestion-card">
    <div class="gestion-header">
      <h1>Registrar Recurso</h1>
      <button routerLink="/recursos" class="btn-volver">← Volver</button>
    </div>

    <div class="seccion">
      <h2>Datos del recurso</h2>
      <form [formGroup]="form" (ngSubmit)="registrarRecurso()">
        <div class="form-grid">
          <label>
            Código
            <input type="text" maxlength="6" formControlName="code" />
          </label>

          <label>
            Nombre
            <input type="text" maxlength="50" formControlName="name" />
          </label>

          <label>
            Cantidad
            <input type="number" min="1" formControlName="quantity" />
          </label>

          <label class="descripcion-field">
            Descripción
            <textarea rows="4" maxlength="200" formControlName="description"></textarea>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-opcion">Registrar</button>
        </div>
      </form>
    </div>

    @if (error) {
      <p class="error">{{ error }}</p>
    }
    @if (exito) {
      <p class="success">{{ exito }}</p>
    }
  </div>
</div>
